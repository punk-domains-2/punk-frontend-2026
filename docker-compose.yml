services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      WATCHPACK_POLLING: "true"
    env_file:
      - path: .env.local
        required: false
    tty: true
    stdin_open: true

volumes:
  node_modules:
  next_cache:
